<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tournament Bot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <section class="carousel">
        <div class="track">

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

        </div>
    </section>

    <section class="info">

        <h1>Tournament Bot</h1>

        <p>
            Create, manage and compete in tournaments with your community.
        </p>

        <div class="sign-in-section">

            <span class="sign-in-label">Sign in with</span>

            <a
                href="https://tournament-tool-f1p7.onrender.com/auth/discord"
                class="discord-button"
                aria-label="Sign in with Discord"
            >
                <img
                    src="assets/discord-svgrepo-com.svg"
                    class="discord-icon"
                    alt="Discord"
                    aria-hidden="true"
                >
            </a>

        </div>

        <div class="auth-divider">
            <span>or</span>
        </div>

        <a
            href="dashboard.html"
            class="guest-button"
        >
            Continue as guest
        </a>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
