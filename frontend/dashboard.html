<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authentication Successful | Tournament Bot</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #0a0a0f;
    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.box {
    width: min(90%, 500px);
    padding: 45px;
    text-align: center;

    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.icon {
    font-size: 60px;
    margin-bottom: 20px;
}

h1 {
    margin: 0 0 15px;
    font-size: 32px;
}

p {
    margin: 0;
    color: #b8b8c5;
    line-height: 1.6;
}

.status {
    margin-top: 25px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(88, 101, 242, 0.12);
    color: #aeb8ff;
}
</style>
</head>

<body>

<div class="box">

    <div class="icon">✅</div>

    <h1>Authentication Successful</h1>

    <p>
        Your Discord account has successfully authenticated
        with Tournament Bot.
    </p>

    <div class="status">
        Discord OAuth + MongoDB session working
    </div>

</div>

</body>
</html>
